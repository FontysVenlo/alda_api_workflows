name: Publish package to Maven Central

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag of the release"
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USER:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      OSSRH_GPG_SECRET_KEY:
        required: true
      OSSRH_GPG_PASSPHRASE:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify version matches tag
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          EXPECTED_TAG="v$POM_VERSION"
          ACTUAL_TAG="${{ inputs.tag }}"
          
          if [[ "$EXPECTED_TAG" != "$ACTUAL_TAG" ]]; then
            echo "Error: Version mismatch!"
            echo "Expected tag: $EXPECTED_TAG (from pom.xml)"
            echo "Actual tag: $ACTUAL_TAG"
            exit 1
          fi
          echo "✓ Version $POM_VERSION matches tag $ACTUAL_TAG"

      - name: Check if already published
        id: check
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TOKEN=$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 -w0)

          RESPONSE=$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $TOKEN" \
            --get "https://central.sonatype.com/api/v1/publisher/published" \
            --data-urlencode "namespace=$GROUP_ID" \
            --data-urlencode "name=$ARTIFACT_ID" \
            --data-urlencode "version=$VERSION")
          PUBLISHED=$(jq -r '.published' <<< "$RESPONSE")

          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISHED" == "true" ]]; then
            echo "::notice::$GROUP_ID:$ARTIFACT_ID:$VERSION is already published on Maven Central, skipping deploy"
          fi
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish package to maven central
        if: steps.check.outputs.published != 'true'
        run: mvn --batch-mode clean deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
          MAVEN_OPTS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED"

  javadoc:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate JavaDoc
        run: mvn --batch-mode compile javadoc:javadoc
        env:
          MAVEN_OPTS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED"

      # maven-javadoc-plugin 3.7+ writes to target/reports/apidocs, older versions to target/site/apidocs
      - name: Locate JavaDoc
        run: |
          if [[ -d target/reports/apidocs ]]; then
            echo "JAVADOC_DIR=target/reports/apidocs" >> "$GITHUB_ENV"
          else
            echo "JAVADOC_DIR=target/site/apidocs" >> "$GITHUB_ENV"
          fi

      - name: Deploy JavaDoc to GitHub Pages - Versioned
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          clean: false
          folder: ${{ env.JAVADOC_DIR }}
          branch: javadoc
          target-folder: ${{ inputs.tag }}

      - name: Deploy JavaDoc to GitHub Pages - Latest
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          clean: true
          folder: ${{ env.JAVADOC_DIR }}
          branch: javadoc
          target-folder: latest
          force: true