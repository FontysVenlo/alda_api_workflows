version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "Bonajo"
    assignees:
      - "Bonajo"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 10
